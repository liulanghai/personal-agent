[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.18",
    "python-dotenv>=1,<2",
    "jsonschema>=4,<5",
    "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-jsonschema",
    "pre-commit>=4",
]

[tool.uv]
# Supply-chain cooldown: only resolve packages published at least a week ago.
exclude-newer = "7 days"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "--cov=agent --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests", "scripts"]
# Only Python sources; docs contain illustrative snippets.
extend-exclude = ["docs", "frontend", "sdk", "node_modules"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "ASYNC", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are designed to be used as defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Header", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["agent"]
strict = true
warn_unused_ignores = true
