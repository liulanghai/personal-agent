# Install once: `uv run pre-commit install`
# Local hooks use the ruff version pinned in uv.lock, so results match CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(docs/openapi\.json|sdk/src/schema\.d\.ts)$
      - id: trailing-whitespace
        exclude: ^(docs/openapi\.json|sdk/src/schema\.d\.ts)$
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        files: ^(frontend|sdk)/|\.mjs$
      - id: eslint
        name: eslint
        entry: npx --no-install eslint --fix
        language: system
        files: ^(frontend/src|sdk/src)/.*\.tsx?$
